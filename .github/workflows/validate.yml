name: OpenSpec validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes --package @fission-ai/openspec@2.1.0 openspec validate --all --strict
